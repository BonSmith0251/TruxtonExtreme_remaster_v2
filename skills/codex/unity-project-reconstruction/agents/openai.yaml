interface:
  display_name: "Unity Project Reconstruction"
  short_description: "Rebuild Unity or Cocos game packages as Unity projects"
  default_prompt: "Use $unity-project-reconstruction to reconstruct this game build or APK as an editable Unity project, identify its source engine and package completeness, recover assets and scenes, translate Cocos behavior into C# when needed, and validate the result with default target Unity 2022.3 LTS while recording missing content and approximations."
